# 多平台 GDExtension 构建工作流
# 在 Windows/macOS/Linux 上分别编译 libvoxelnative，并打包所有平台的二进制。
# 触发方式：
#   - 推送到 main 分支
#   - 手动触发（Actions 页面 → Run workflow）
#   - 打 tag（v*）时自动构建并附带 release 资产
#
# 产物：native/bin/ 下各平台命名二进制 + 根目录 voxelnative.gdextension
# 使用者无需编译环境，直接拷贝 native/bin + voxelnative.gdextension 即可。

name: Build GDExtension

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 每个平台独立 job，GitHub 提供原生 runner，无需交叉编译工具链
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x86_64
            artifact: linux.x86_64
          - os: windows-latest
            target: windows
            arch: x86_64
            artifact: windows.x86_64
          - os: macos-13        # Intel mac
            target: macos
            arch: x86_64
            artifact: macos.x86_64
          - os: macos-14        # Apple Silicon mac
            target: macos
            arch: arm64
            artifact: macos.arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # 拉取 godot-cpp 子模块

      # macOS 交叉编译 Intel/Apple Silicon：通过 CMAKE_OSX_ARCHITECTURES
      - name: Configure (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          cmake -S native -B native/build \
            -DGODOTCPP_API_VERSION=4.7 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      # Linux / Windows：原生架构直接编译
      - name: Configure (Linux/Windows)
        if: matrix.target != 'macos'
        shell: bash
        run: |
          cmake -S native -B native/build \
            -DGODOTCPP_API_VERSION=4.7 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build native/build --config Release -j 4

      # 产物重命名为 .gdextension 声明的文件名（macos/windows/linux 各自命名规则）
      - name: Rename artifacts
        shell: bash
        run: |
          mkdir -p dist/native/bin
          cp native/voxelnative.gdextension dist/voxelnative.gdextension
          if [ "${{ matrix.target }}" = "macos" ]; then
            cp native/bin/libvoxelnative.dylib dist/native/bin/libvoxelnative.macos.debug.${{ matrix.arch }}.dylib
            cp native/bin/libvoxelnative.dylib dist/native/bin/libvoxelnative.macos.release.${{ matrix.arch }}.dylib
          elif [ "${{ matrix.target }}" = "windows" ]; then
            cp native/bin/voxelnative.dll dist/native/bin/voxelnative.windows.debug.x86_64.dll
            cp native/bin/voxelnative.dll dist/native/bin/voxelnative.windows.release.x86_64.dll
          else
            cp native/bin/libvoxelnative.so dist/native/bin/libvoxelnative.linux.debug.x86_64.so
            cp native/bin/libvoxelnative.so dist/native/bin/libvoxelnative.linux.release.x86_64.so
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: voxelnative-${{ matrix.artifact }}
          path: dist/

  # 汇总所有平台产物为一个完整插件包
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Package
        run: |
          mkdir -p release
          # 各平台产物合并（download-artifact 会合并目录，直接复制即可）
          cp -r artifacts/* release/
          ls -la release/native/bin/

      - uses: actions/upload-artifact@v4
        with:
          name: voxelnative-all-platforms
          path: release/

      # 打 tag 时自动发布 GitHub Release（可选）
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/voxelnative.gdextension
            release/native/bin/*
