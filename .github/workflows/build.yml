# 多平台 GDExtension 构建工作流
# 在 Windows/macOS/Linux 上分别编译 libvoxelnative，并打包所有平台的二进制为完整插件。
# 触发方式：
#   - 推送到 main 分支
#   - 手动触发（Actions 页面 → Run workflow）
#   - 打 tag（v*）时自动构建并附带 release 资产
#
# 产物：addons/VoxelSupport/Native/ 下各平台命名动态库 + voxelnative.gdextension
# 使用者无需编译环境，下载 addons/VoxelSupport/ 文件夹即可使用。

name: Build GDExtension

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 每个平台独立 job，GitHub 提供原生 runner，无需交叉编译工具链
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x86_64
            artifact: linux.x86_64
          - os: windows-latest
            target: windows
            arch: x86_64
            artifact: windows.x86_64
          - os: macos-13        # Intel mac
            target: macos
            arch: x86_64
            artifact: macos.x86_64
          - os: macos-14        # Apple Silicon mac
            target: macos
            arch: arm64
            artifact: macos.arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # 拉取 godot-cpp 子模块

      # macOS 交叉编译 Intel/Apple Silicon：通过 CMAKE_OSX_ARCHITECTURES
      - name: Configure (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          cmake -S gdextension -B gdextension/build \
            -DGODOTCPP_API_VERSION=4.7 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      # Linux / Windows：原生架构直接编译
      - name: Configure (Linux/Windows)
        if: matrix.target != 'macos'
        shell: bash
        run: |
          cmake -S gdextension -B gdextension/build \
            -DGODOTCPP_API_VERSION=4.7 \
            -DCMAKE_BUILD_TYPE=Release

      # 产物已由 CMake 直接输出到 addons/VoxelSupport/Native/（无需复制）
      - name: Build
        shell: bash
        run: cmake --build gdextension/build --config Release -j 4

      # 按 .gdextension 声明的文件名重命名（macos/windows/linux 各自命名规则）
      - name: Rename artifacts
        shell: bash
        run: |
          mkdir -p dist/addons/VoxelSupport/Native
          cp addons/VoxelSupport/Native/voxelnative.gdextension dist/addons/VoxelSupport/Native/voxelnative.gdextension
          if [ "${{ matrix.target }}" = "macos" ]; then
            cp addons/VoxelSupport/Native/libvoxelnative.dylib dist/addons/VoxelSupport/Native/libvoxelnative.macos.debug.${{ matrix.arch }}.dylib
            cp addons/VoxelSupport/Native/libvoxelnative.dylib dist/addons/VoxelSupport/Native/libvoxelnative.macos.release.${{ matrix.arch }}.dylib
          elif [ "${{ matrix.target }}" = "windows" ]; then
            cp addons/VoxelSupport/Native/voxelnative.dll dist/addons/VoxelSupport/Native/voxelnative.windows.debug.x86_64.dll
            cp addons/VoxelSupport/Native/voxelnative.dll dist/addons/VoxelSupport/Native/voxelnative.windows.release.x86_64.dll
          else
            cp addons/VoxelSupport/Native/libvoxelnative.so dist/addons/VoxelSupport/Native/libvoxelnative.linux.debug.x86_64.so
            cp addons/VoxelSupport/Native/libvoxelnative.so dist/addons/VoxelSupport/Native/libvoxelnative.linux.release.x86_64.so
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: voxelnative-${{ matrix.artifact }}
          path: dist/

  # 汇总所有平台产物为一个完整插件包（用户下载 addons/VoxelSupport/ 即可使用）
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble complete addon
        run: |
          # 复制插件全部内容（GDScript + 各平台二进制）
          rm -rf release
          mkdir -p release/addons/VoxelSupport
          cp -r addons/VoxelSupport/Importers release/addons/VoxelSupport/
          cp -r addons/VoxelSupport/Runtime release/addons/VoxelSupport/
          cp -r addons/VoxelSupport/Shaders release/addons/VoxelSupport/
          cp addons/VoxelSupport/plugin.cfg addons/VoxelSupport/plugin.gd release/addons/VoxelSupport/
          cp addons/VoxelSupport/icon.png release/addons/VoxelSupport/ 2>/dev/null || true
          # 合并各平台编译产物
          mkdir -p release/addons/VoxelSupport/Native
          cp addons/VoxelSupport/Native/voxelnative.gdextension release/addons/VoxelSupport/Native/
          cp -r artifacts/addons/VoxelSupport/Native/*.dylib artifacts/addons/VoxelSupport/Native/*.so artifacts/addons/VoxelSupport/Native/*.dll release/addons/VoxelSupport/Native/ 2>/dev/null || true
          echo "=== 最终插件包结构 ==="
          find release -type f | sort
          echo "=== native 目录 ==="
          ls -la release/addons/VoxelSupport/Native/

      - uses: actions/upload-artifact@v4
        with:
          name: voxel-support-addon
          path: release/

      # 打 tag 时自动发布 GitHub Release（完整插件包）
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/addons/VoxelSupport/**/*
